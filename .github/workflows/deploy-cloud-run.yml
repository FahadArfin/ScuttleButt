name: Deploy development to Cloud Run

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scuttlebutt-cloud-run-development
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  SERVICE: scuttlebutt
  REPOSITORY: scuttlebutt

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build application container
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/app
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
        run: |
          docker build --build-arg "VITE_GIPHY_API_KEY=$VITE_GIPHY_API_KEY" --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:development" .

      - name: Push application container
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/app
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:development"

      - name: Deploy Cloud Run revision
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/app:${{ github.sha }}

      - name: Verify deployed service
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$SERVICE_URL/health"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
